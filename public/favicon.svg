<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OFIX">
  <defs>
    <!-- Mismo gradiente que --gradient-primary en index.css -->
    <linearGradient id="ofix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#5b8def"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#ofix)"/>
  <!-- La "O" de OFIX. Misma geometria que los PNG de respaldo, para que el
       icono se vea igual en cualquier navegador. -->
  <circle cx="32" cy="32" r="18.6" fill="none" stroke="#fff" stroke-width="6.4"/>
</svg>
